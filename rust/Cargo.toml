[package]
name = "photomatch_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "photomatch_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
